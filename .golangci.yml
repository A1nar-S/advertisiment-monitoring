version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - depguard
  settings:
    misspell:
      ignore-rules: [advertisiment] # the module path
    depguard:
      # Vertical slices talk through their Service and internal/events, never
      # through each other's packages (docs/PROJECT_NOTES.md).
      rules:
        scraping-is-standalone:
          files: ["**/internal/scraping/**"]
          deny:
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/listings, desc: "sources only produce events"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/subscriptions, desc: "sources only produce events"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/notifications, desc: "sources only produce events"}
        listings-is-standalone:
          files: ["**/internal/listings/**"]
          deny:
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/subscriptions, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/notifications, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/scraping, desc: "slices do not import each other"}
        subscriptions-is-standalone:
          files: ["**/internal/subscriptions/**"]
          deny:
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/listings, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/notifications, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/scraping, desc: "slices do not import each other"}
        notifications-is-standalone:
          files: ["**/internal/notifications/**"]
          deny:
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/listings, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/subscriptions, desc: "slices do not import each other"}
            - {pkg: github.com/A1nar-S/advertisiment-monitoring/internal/scraping, desc: "slices do not import each other"}
  exclusions:
    paths:
      - internal/.*/.*db # sqlc output

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/A1nar-S/advertisiment-monitoring
  exclusions:
    paths:
      - internal/.*/.*db # sqlc output
