# One env file for everything: the repo-root .env (see .env.example).
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d                      # Postgres + Kafka only
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d --build # + the services
#
# `make up` / `make infra` in the repo root run exactly these. Searches are
# made by users through the bot and the dashboard; there is no config file.
x-service: &service
  build:
    context: ..
  restart: unless-stopped
  profiles: [app]
  env_file:
    - path: ../.env
      required: false
  environment:
    # Inside the compose network, not localhost.
    DB_HOST: postgres
    DB_PORT: "5432"
    KAFKA_BROKERS: kafka:29092
  depends_on:
    postgres: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092" # EXTERNAL listener, for services run on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is what containers reach (advertised as kafka:29092); EXTERNAL
      # is advertised as localhost so host-side tools work too.
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: QmZ1MHJhQW5JaUNkWHlWZQ==
      # Single broker: the defaults of 3 would leave consumer groups unusable.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Plenty for a laptop; the default heap is sized for a server.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      # The image runs as uid 1000. A bind mount, or a volume on a path the image
      # lacks, is created root-owned and Kafka cannot write meta.properties there.
      # A named volume on the image's own data dir inherits the right owner.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics with explicit partition counts (auto-creation would give 1).
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in listings.discovered listings.new notifications.requested; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env (make env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (make env)}
      POSTGRES_DB: ${DB_NAME:-ads_monitor}
    volumes:
      # Named volume: a bind mount ends up root-owned on Linux and breaks
      # `go test ./...` / builds that walk the repo.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  scraper:
    <<: *service
    build: {context: .., args: {CMD: scraper}}
  ingest:
    <<: *service
    build: {context: .., args: {CMD: ingest}}
  matcher:
    <<: *service
    build: {context: .., args: {CMD: matcher}}
  notifier:
    <<: *service
    build: {context: .., args: {CMD: notifier}}
  # The chat bot people manage their searches with (/watch, /searches, /dashboard).
  bot:
    <<: *service
    build: {context: .., args: {CMD: bot}}
  # The dashboard. Bound to this machine only; publish it with a tunnel
  # (PUBLIC_URL in .env) if others should reach it.
  api:
    <<: *service
    build: {context: .., args: {CMD: api}}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      API_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
  # One-off maintenance: `make purge`, or `... --profile tools run --rm admin migrate`.
  admin:
    <<: *service
    profiles: [tools]
    restart: "no"
    build: {context: .., args: {CMD: admin}}
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  kafka-data:
  pg-data:
